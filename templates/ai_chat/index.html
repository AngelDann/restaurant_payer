{% extends "base.html" %}
{% block title %}Demostración HTMX – PlavPay{% endblock %}
{% block content %}
<div class="container py-4">
<div class="page-head">
  <div>
    <h1>Demostración HTMX</h1>
    <p>Carga un fragmento de HTML sin recargar la página.</p>
  </div>
</div>

<div class="panel panel-pad mb-4">
  <button type="button" class="btn btn-brand" hx-get="{% url 'ai_chat_partial_ping' %}" hx-target="#partial-target" hx-indicator="#htmx-indicator">
    <span id="htmx-indicator" class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span>Cargar fragmento</span>
  </button>
  <div id="partial-target" class="mt-3 p-3 rounded-3 bg-light" aria-live="polite"></div>
</div>

<div class="panel panel-pad">
  <h2 class="h5">Demostración de WebSocket</h2>
  <p class="text-muted mb-0">Ruta: <code>ws/chat/</code> (consumidor de eco).</p>
</div>
</div>
{% endblock %}
