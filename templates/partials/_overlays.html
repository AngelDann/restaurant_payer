<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <div class="confirm-body">
      <div class="icon"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i></div>
      <h2 id="confirm-title">¿Confirmas esta acción?</h2>
      <p data-confirm-message></p>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-soft" value="cancel">Cancelar</button>
      <button class="btn btn-brand" value="accept" autofocus>Confirmar</button>
    </div>
  </form>
</dialog>
